name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Testlar (vazifalar, o'yinlar, o'zbek yozuvi, reyting serveri)
        run: npm test
      - name: Web build
        run: npx expo export --platform web --output-dir dist
